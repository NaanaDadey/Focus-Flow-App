name: focusflow
description: "FocusFlow — a time-management & anti-procrastination companion for students."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.5.6

  # State management
  provider: ^6.1.2

  # Local storage (guest mode + offline cache)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Notifications & scheduling
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # UI / UX
  intl: ^0.19.0
  fl_chart: ^0.68.0
  table_calendar: ^3.1.2
  flutter_slidable: ^3.1.1
  uuid: ^4.4.0
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icon/

# ---------------------------------------------------------------------
# App icon generation. Run after any change to the source images:
#   dart run flutter_launcher_icons
# This writes the real per-platform icon files into android/, ios/,
# windows/, macos/, web/ — regenerate whenever assets/icon/*.png changes.
# ---------------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#6C63FF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#6C63FF"
    theme_color: "#6C63FF"

